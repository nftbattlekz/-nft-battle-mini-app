<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>

<meta name="theme-color" content="#050b14">

<title>NOMER CLUB</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
    --bg:#050a12;
    --bg2:#07111e;
    --card:#0d1928;
    --card2:#111f31;
    --line:#1d3854;

    --text:#f4f8ff;
    --muted:#7d94ad;

    --blue:#279cff;
    --cyan:#5cdcff;
    --green:#48df9b;
    --yellow:#ffd166;
    --red:#ff637d;
    --purple:#a77cff;

    --shadow:0 20px 60px rgba(0,0,0,.35);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    background:var(--bg);
}

body{
    margin:0;
    min-height:100vh;
    overflow-x:hidden;

    color:var(--text);

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(38,145,255,.20),
            transparent 35%
        ),
        radial-gradient(
            circle at 110% 20%,
            rgba(72,225,255,.09),
            transparent 27%
        ),
        linear-gradient(
            180deg,
            var(--bg2),
            var(--bg)
        );
}

body::before{
    content:"";

    position:fixed;
    inset:0;

    pointer-events:none;

    opacity:.17;

    background-image:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size:30px 30px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent 75%
        );
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none !important;
}

/* =========================
   APP
========================= */

.app{
    position:relative;
    z-index:2;

    max-width:650px;

    margin:0 auto;

    padding:
        12px
        12px
        112px;
}

/* =========================
   HEADER
========================= */

.header{
    position:sticky;

    top:0;

    z-index:50;

    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:10px;

    padding:
        8px
        0
        15px;

    background:
        linear-gradient(
            180deg,
            rgba(7,17,30,.98) 72%,
            rgba(7,17,30,0)
        );

    backdrop-filter:blur(14px);
}

.brand{
    display:flex;
    align-items:center;

    gap:10px;
}

.logo{
    position:relative;

    width:43px;
    height:43px;

    display:grid;
    place-items:center;

    overflow:hidden;

    border-radius:14px;

    background:
        linear-gradient(
            145deg,
            #147be7,
            #55d8ff
        );

    font-size:15px;
    font-weight:1000;

    box-shadow:
        0 0 28px rgba(39,156,255,.30);
}

.logo::after{
    content:"";

    position:absolute;

    top:-30px;
    bottom:-30px;

    width:35px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.45),
            transparent
        );

    transform:
        translateX(-70px)
        rotate(20deg);

    animation:
        logoLight
        4s
        infinite;
}

@keyframes logoLight{
    0%,55%{
        transform:
            translateX(-70px)
            rotate(20deg);
    }

    85%,100%{
        transform:
            translateX(80px)
            rotate(20deg);
    }
}

.brand-title{
    margin:0;

    font-size:17px;
    font-weight:950;

    letter-spacing:.6px;
}

.brand-sub{
    margin-top:2px;

    color:var(--muted);

    font-size:9px;

    letter-spacing:1.1px;
}

.header-actions{
    display:flex;
    align-items:center;

    gap:6px;
}

.balance{
    padding:
        9px
        10px;

    white-space:nowrap;

    border:
        1px
        solid
        var(--line);

    border-radius:12px;

    background:
        rgba(13,25,40,.92);

    font-size:12px;
    font-weight:900;
}

.admin-button{
    min-height:37px;

    padding:
        0
        11px;

    border:
        1px
        solid
        #745b20;

    border-radius:12px;

    color:#ffe08a;

    background:
        linear-gradient(
            145deg,
            #2a210d,
            #18150d
        );

    font-size:10px;
    font-weight:950;

    box-shadow:
        0 0 20px
        rgba(255,208,95,.10);
}

/* =========================
   PAGES
========================= */

.page{
    display:none;
}

.page.active{
    display:block;

    animation:
        pageShow
        .24s
        ease;
}

@keyframes pageShow{
    from{
        opacity:0;
        transform:
            translateY(7px);
    }

    to{
        opacity:1;
        transform:none;
    }
}

/* =========================
   HERO
========================= */

.hero{
    position:relative;

    overflow:hidden;

    padding:16px;

    border:
        1px
        solid
        #203c5a;

    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            rgba(17,36,59,.96),
            rgba(7,15,25,.97)
        );

    box-shadow:var(--shadow);
}

.hero::before{
    content:"";

    position:absolute;

    width:250px;
    height:250px;

    top:-145px;
    right:-110px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(54,174,255,.32),
            transparent 65%
        );
}

.hero::after{
    content:"";

    position:absolute;

    width:200px;
    height:200px;

    bottom:-120px;
    left:-90px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(75,225,255,.12),
            transparent 65%
        );
}

.hero-content{
    position:relative;
    z-index:2;
}

.eyebrow{
    color:#74d9ff;

    font-size:10px;
    font-weight:900;

    letter-spacing:1.4px;
}

.hero h2{
    margin:
        5px
        0
        4px;

    font-size:24px;

    line-height:1.1;
}

.hero-description{
    margin:0;

    color:var(--muted);

    font-size:12px;
}

/* =========================
   STATS
========================= */

.stats{
    display:grid;

    grid-template-columns:
        repeat(
            3,
            1fr
        );

    gap:7px;

    margin:
        14px
        0;
}

.stat{
    padding:9px;

    border:
        1px
        solid
        rgba(98,151,199,.22);

    border-radius:14px;

    background:
        rgba(4,11,19,.52);
}

.stat span{
    display:block;

    color:#7189a1;

    font-size:9px;

    letter-spacing:.7px;
}

.stat strong{
    display:block;

    margin-top:4px;

    font-size:14px;
}

/* =========================
   PLATE AREA
========================= */

.spin-area{
    position:relative;

    overflow:hidden;

    padding:
        12px
        8px
        13px;

    margin-bottom:10px;

    border:
        1px
        solid
        rgba(83,132,175,.18);

    border-radius:20px;

    background:
        rgba(3,9,16,.52);
}

.scanner{
    position:absolute;

    left:-20%;
    right:-20%;

    height:1px;

    top:5px;

    pointer-events:none;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(89,215,255,.75),
            transparent
        );

    animation:
        scan
        3.2s
        linear
        infinite;
}

@keyframes scan{
    0%{
        transform:
            translateY(0);
        opacity:0;
    }

    15%{
        opacity:.8;
    }

    100%{
        transform:
            translateY(145px);
        opacity:0;
    }
}

.plate{
    position:relative;

    width:
        min(
            100%,
            470px
        );

    min-height:96px;

    margin:
        9px
        auto;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:
        12px
        11px
        12px
        18px;

    overflow:hidden;

    color:#0a0d10;

    border:
        3px
        solid
        #14191e;

    border-radius:14px;

    background:
        linear-gradient(
            180deg,
            #ffffff,
            #e7ecf0
        );

    box-shadow:
        inset 0 0 0 2px white,
        0 18px 36px rgba(0,0,0,.40);
}

.plate::before{
    content:"";

    position:absolute;

    inset:5px;

    border:
        1px
        solid
        #aab5bf;

    border-radius:8px;

    pointer-events:none;
}

.plate-code{
    position:relative;

    z-index:2;

    white-space:nowrap;

    font-size:
        clamp(
            29px,
            8vw,
            47px
        );

    font-weight:1000;

    letter-spacing:1px;
}

.plate-region{
    position:relative;

    z-index:2;

    min-width:73px;

    padding-left:9px;

    text-align:center;

    border-left:
        2px
        solid
        #14181c;

    font-size:19px;
    font-weight:1000;

    line-height:1;
}

.plate-region small{
    display:block;

    margin-top:5px;

    font-size:8px;

    letter-spacing:.4px;
}

.plate.spinning{
    animation:
        plateShake
        .10s
        linear
        infinite
        alternate;
}

@keyframes plateShake{
    from{
        transform:
            translateX(-2px)
            scale(.995);
    }

    to{
        transform:
            translateX(2px)
            scale(1.005);
    }
}

/* =========================
   WIN EFFECT
========================= */

.win-flash{
    position:absolute;

    inset:0;

    opacity:0;

    pointer-events:none;
}

.spin-area.common .win-flash{
    animation:
        flash
        .6s;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.20),
            transparent 58%
        );
}

.spin-area.uncommon .win-flash{
    animation:
        flash
        .8s;

    background:
        radial-gradient(
            circle,
            rgba(66,223,155,.35),
            transparent 58%
        );
}

.spin-area.rare .win-flash{
    animation:
        flash
        1s;

    background:
        radial-gradient(
            circle,
            rgba(39,156,255,.46),
            transparent 58%
        );
}

.spin-area.epic .win-flash{
    animation:
        flash
        1.2s;

    background:
        radial-gradient(
            circle,
            rgba(167,124,255,.50),
            transparent 60%
        );
}

.spin-area.legendary .win-flash{
    animation:
        legendaryFlash
        1.5s;

    background:
        radial-gradient(
            circle,
            rgba(255,209,102,.60),
            transparent 63%
        );
}

.spin-area.mythic .win-flash{
    animation:
        mythicFlash
        1.8s;

    background:
        radial-gradient(
            circle,
            rgba(255,83,128,.62),
            rgba(150,93,255,.30),
            transparent 65%
        );
}

@keyframes flash{
    0%{
        opacity:0;
    }

    25%{
        opacity:1;
    }

    100%{
        opacity:0;
    }
}

@keyframes legendaryFlash{
    0%{
        opacity:0;
        transform:
            scale(.7);
    }

    25%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:
            scale(1.45);
    }
}

@keyframes mythicFlash{
    0%{
        opacity:0;
        transform:
            scale(.6)
            rotate(-5deg);
    }

    25%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:
            scale(1.55)
            rotate(8deg);
    }
}

/* =========================
   RESULT
========================= */

.result{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:8px;

    margin-top:7px;
}

.rarity{
    display:inline-flex;
    align-items:center;

    min-height:28px;

    padding:
        0
        9px;

    border:
        1px
        solid
        #2b435b;

    border-radius:99px;

    background:#07111c;

    font-size:10px;
    font-weight:900;
}

.rarity-common{
    color:#c3ced9;
}

.rarity-uncommon{
    color:#4ee0a0;
    border-color:#24523e;
}

.rarity-rare{
    color:#5bb9ff;
    border-color:#285779;
}

.rarity-epic{
    color:#ae8cff;
    border-color:#534579;
}

.rarity-legendary{
    color:#ffda76;
    border-color:#6c5725;
    text-shadow:
        0 0 12px
        rgba(255,209,102,.32);
}

.rarity-mythic{
    color:#ff7699;
    border-color:#79293f;
    text-shadow:
        0 0 14px
        rgba(255,99,125,.40);
}

.result-hint{
    color:var(--muted);

    font-size:11px;

    text-align:right;
}

/* =========================
   BUTTONS
========================= */

.btn{
    position:relative;

    overflow:hidden;

    min-height:47px;

    padding:
        0
        14px;

    border:0;

    border-radius:14px;

    color:white;

    font-weight:900;

    transition:
        transform .15s,
        opacity .15s,
        filter .15s;
}

.btn:active{
    transform:
        scale(.975);
}

.btn:disabled{
    opacity:.4;
    cursor:default;
}

.btn-primary{
    background:
        linear-gradient(
            110deg,
            #1877e8,
            #35baff
        );

    box-shadow:
        0 11px 28px
        rgba(39,156,255,.22);
}

.btn-primary::after{
    content:"";

    position:absolute;

    top:-30%;
    bottom:-30%;

    width:60px;

    left:-90px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.28),
            transparent
        );

    transform:
        skewX(-18deg);

    animation:
        buttonShine
        3.5s
        infinite;
}

@keyframes buttonShine{
    0%,55%{
        left:-90px;
    }

    85%,100%{
        left:120%;
    }
}

.btn-secondary{
    color:#dceeff;

    border:
        1px
        solid
        #285177;

    background:#102239;
}

.btn-danger{
    color:#ffafbc;

    border:
        1px
        solid
        #693144;

    background:#301723;
}

.btn-gold{
    color:#fff4cf;

    border:
        1px
        solid
        #947124;

    background:
        linear-gradient(
            110deg,
            #806116,
            #c99a28
        );
}

.btn-ghost{
    color:#d6e7f7;

    border:
        1px
        solid
        #203a54;

    background:#08121e;
}

.btn-small{
    min-height:36px;

    padding:
        0
        11px;

    border-radius:11px;

    font-size:11px;
}

.full{
    width:100%;
}

.quick-actions{
    display:none;

    grid-template-columns:
        1fr
        1fr;

    gap:7px;

    margin-top:8px;
}

.quick-actions.show{
    display:grid;

    animation:
        quickShow
        .25s
        ease;
}

@keyframes quickShow{
    from{
        opacity:0;
        transform:
            translateY(6px)
            scale(.98);
    }

    to{
        opacity:1;
        transform:none;
    }
}

/* =========================
   CARDS
========================= */

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;

    gap:10px;

    margin:
        18px
        2px
        9px;
}

.section-title h3{
    margin:0;

    font-size:18px;
}

.section-title p{
    margin:
        2px
        0
        0;

    color:var(--muted);

    font-size:10px;
}

.card{
    padding:13px;

    margin-bottom:9px;

    border:
        1px
        solid
        #1c3249;

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            rgba(13,26,43,.97),
            rgba(7,15,25,.98)
        );

    box-shadow:
        0 12px 30px
        rgba(0,0,0,.14);

    animation:
        cardShow
        .22s
        ease;
}

@keyframes cardShow{
    from{
        opacity:0;
        transform:
            translateY(5px);
    }

    to{
        opacity:1;
        transform:none;
    }
}

.row{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;
}

.grow{
    flex:1;
    min-width:0;
}

.title{
    font-weight:900;
}

.big{
    font-size:18px;
    font-weight:950;
}

.muted{
    color:var(--muted);
}

.small{
    font-size:11px;
}

.actions{
    display:flex;

    gap:7px;

    flex-wrap:wrap;

    margin-top:10px;
}

.badge{
    display:inline-flex;
    align-items:center;

    padding:
        5px
        8px;

    border:
        1px
        solid
        #29445e;

    border-radius:99px;

    background:#08131f;

    font-size:10px;
    font-weight:900;
}

.plate-name{
    margin:
        5px
        0;

    font-size:21px;
    font-weight:1000;

    letter-spacing:.8px;
}

.price{
    white-space:nowrap;

    font-size:14px;
    font-weight:950;
}

/* =========================
   INPUTS
========================= */

.toolbar{
    display:flex;

    gap:7px;

    margin-bottom:9px;
}

.input,
.select{
    width:100%;

    min-height:43px;

    padding:
        0
        11px;

    outline:0;

    color:var(--text);

    border:
        1px
        solid
        #203a53;

    border-radius:12px;

    background:#07111d;
}

.input:focus,
.select:focus{
    border-color:#2f80bb;

    box-shadow:
        0 0 0 3px
        rgba(39,156,255,.08);
}

.empty{
    padding:
        28px
        12px;

    text-align:center;

    color:var(--muted);

    border:
        1px
        dashed
        #27435e;

    border-radius:17px;
}

.progress{
    height:7px;

    margin-top:9px;

    overflow:hidden;

    border-radius:99px;

    background:#050c14;
}

.progress span{
    display:block;

    height:100%;

    border-radius:99px;

    background:
        linear-gradient(
            90deg,
            #2c94ef,
            #5bdcff
        );

    transition:
        width
        .5s;
}

/* =========================
   PROFILE
========================= */

.profile-head{
    display:flex;
    align-items:center;

    gap:11px;
}

.avatar{
    width:54px;
    height:54px;

    display:grid;
    place-items:center;

    flex:0 0 auto;

    border:
        1px
        solid
        #294b68;

    border-radius:17px;

    background:
        linear-gradient(
            145deg,
            #183554,
            #0b1725
        );

    font-size:21px;
    font-weight:1000;
}

.creator{
    color:#ffde7f;

    border-color:#6e5922;

    background:#211a0c;
}

/* =========================
   ADMIN
========================= */

.admin-card{
    border-color:#6b5725;

    background:
        radial-gradient(
            circle at 100% 0,
            rgba(255,207,92,.15),
            transparent 35%
        ),
        linear-gradient(
            145deg,
            #1a1a14,
            #0d141d
        );
}

.admin-live{
    display:inline-flex;
    align-items:center;

    gap:6px;

    color:#7df0b1;

    font-size:10px;
    font-weight:900;
}

.admin-live::before{
    content:"";

    width:7px;
    height:7px;

    border-radius:50%;

    background:#4ae49c;

    box-shadow:
        0 0 12px
        #4ae49c;

    animation:
        pulse
        1.5s
        infinite;
}

@keyframes pulse{
    50%{
        opacity:.35;
        transform:
            scale(.7);
    }
}

.admin-stats{
    display:grid;

    grid-template-columns:
        repeat(
            4,
            1fr
        );

    gap:6px;

    margin-top:12px;
}

.admin-stat{
    padding:9px 5px;

    text-align:center;

    border:
        1px
        solid
        #293e52;

    border-radius:12px;

    background:#08111b;
}

.admin-stat strong{
    display:block;

    font-size:15px;
}

.admin-stat span{
    color:var(--muted);

    font-size:8px;
}

/* =========================
   NAV
========================= */

.nav{
    position:fixed;

    left:50%;
    bottom:0;

    transform:
        translateX(-50%);

    z-index:80;

    width:
        min(
            650px,
            100%
        );

    display:grid;

    grid-template-columns:
        repeat(
            5,
            1fr
        );

    gap:2px;

    padding:
        7px
        7px
        max(
