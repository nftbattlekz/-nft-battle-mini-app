<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>NEXORA</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:
        radial-gradient(circle at 50% -10%,#35186b 0,#090a0f 35%),
        #090a0f;
    color:white;
    font-family:Arial,sans-serif;
}

button{
    font-family:inherit;
}

.app{
    max-width:700px;
    margin:auto;
    padding-bottom:105px;
}

header{
    position:sticky;
    top:0;
    z-index:50;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px;
    background:rgba(8,9,14,.88);
    backdrop-filter:blur(20px);
    border-bottom:1px solid #20232d;
}

.logo{
    font-size:24px;
    font-weight:1000;
    letter-spacing:3px;
}

.balance{
    padding:10px 14px;
    border-radius:15px;
    background:#151822;
    border:1px solid #303442;
    font-weight:900;
}

.page{
    display:none;
    padding:14px;
}

.page.active{
    display:block;
}

.title{
    font-size:29px;
    font-weight:1000;
    margin:8px 0 16px;
}

.subtitle{
    color:#858b9b;
    font-size:13px;
    margin-top:-10px;
    margin-bottom:17px;
}

.card{
    background:rgba(17,19,28,.94);
    border:1px solid #292d39;
    border-radius:24px;
    padding:17px;
    margin-bottom:13px;
    box-shadow:0 15px 45px #0004;
}

/* PROFILE */

.profile{
    position:relative;
    overflow:hidden;
    padding:21px;
    background:
        radial-gradient(circle at 100% 0,#7c3aed55,transparent 42%),
        linear-gradient(145deg,#191422,#0f1118);
}

.avatar{
    width:76px;
    height:76px;
    border-radius:24px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    font-weight:1000;
    background:linear-gradient(
        135deg,
        #7138ee,
        #d52882
    );
    box-shadow:0 10px 35px #7138ee55;
}

.name{
    font-size:23px;
    font-weight:1000;
    margin-top:14px;
}

.tgid{
    color:#7e8492;
    margin-top:5px;
    font-size:13px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:20px;
}

.stat{
    background:#0b0d13;
    border-radius:17px;
    padding:14px 5px;
    text-align:center;
}

.stat b{
    display:block;
    font-size:18px;
}

.stat span{
    color:#777d8b;
    font-size:10px;
    margin-top:4px;
    display:block;
}

/* CASES */

.case-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:13px;
}

.case{
    position:relative;
    min-height:285px;
    overflow:hidden;
    border-radius:25px;
    padding:13px;
    background:
        linear-gradient(
            145deg,
            #181b27,
            #0e1016
        );
    border:1px solid #303541;
    box-shadow:0 15px 40px #0005;
    transition:.25s;
}

.case:active{
    transform:scale(.97);
}

.case-art{
    height:155px;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:72px;
    background:
        radial-gradient(
            circle at center,
            #7138ee99,
            #19132b 50%,
            #0b0d12
        );
    box-shadow:
        inset 0 0 45px #000,
        0 0 25px #7138ee22;
}

.case:nth-child(2n) .case-art{
    background:
        radial-gradient(
            circle at center,
            #db277799,
            #261322 50%,
            #0b0d12
        );
}

.case-name{
    font-size:19px;
    font-weight:1000;
    margin-top:13px;
}

.case-sub{
    color:#777e8e;
    font-size:11px;
    margin-top:4px;
}

.case-count{
    color:#a78bfa;
    font-size:11px;
    margin-top:7px;
    font-weight:800;
}

.open-btn{
    width:100%;
    border:0;
    padding:13px;
    margin-top:11px;
    border-radius:15px;
    color:white;
    background:linear-gradient(
        135deg,
        #7c3aed,
        #9333ea
    );
    font-weight:1000;
}

/* INVENTORY */

.nft{
    display:flex;
    align-items:center;
    gap:13px;
}

.nft-art{
    width:72px;
    height:72px;
    flex:none;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:38px;
    background:
        radial-gradient(
            circle,
            #4b3280,
            #11141b
        );
    border:1px solid #373b49;
}

.nft-info{
    flex:1;
}

.nft-name{
    font-size:16px;
    font-weight:1000;
}

.nft-rarity{
    margin-top:4px;
    font-size:12px;
    font-weight:900;
}

.nft-value{
    margin-top:6px;
    font-weight:900;
}

.sell{
    border:0;
    border-radius:13px;
    padding:10px 12px;
    background:#222631;
    color:white;
    font-weight:900;
}

.sell-card{
    transition:
        .5s ease;
}

.sell-card.selling{
    opacity:0;
    transform:
        translateX(130px)
        scale(.65)
        rotate(8deg);
}

/* RARITY */

.Common{
    color:#b8becb;
}

.Rare{
    color:#38bdf8;
}

.Epic{
    color:#a78bfa;
}

.Legendary{
    color:#fbbf24;
}

.Mythic{
    color:#fb7185;
    text-shadow:0 0 12px #fb718566;
}

/* RATING */

.tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:13px;
}

.tab{
    border:0;
    padding:13px;
    border-radius:15px;
    background:#171a23;
    color:#858b99;
    font-weight:1000;
}

.tab.active{
    color:white;
    background:#7437e8;
}

.leader{
    display:flex;
    align-items:center;
    gap:11px;
    padding:14px 0;
    border-bottom:1px solid #252936;
}

.place{
    width:35px;
    color:#737987;
    font-weight:1000;
}

.lname{
    flex:1;
    font-weight:900;
}

.lvalue{
    font-weight:1000;
    color:#b497ff;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    z-index:200;
    display:none;
    align-items:center;
    justify-content:center;
    padding:14px;
    background:#000c;
    backdrop-filter:blur(16px);
}

.modal.show{
    display:flex;
}

.modal-box{
    position:relative;
    width:100%;
    max-width:640px;
    border-radius:28px;
    padding:18px;
    background:
        radial-gradient(
            circle at 50% 0,
            #402078,
            #11131b 45%
        );
    border:1px solid #373b4a;
    box-shadow:0 30px 100px #000;
}

.close{
    position:absolute;
    right:14px;
    top:12px;
    width:38px;
    height:38px;
    border:0;
    border-radius:13px;
    background:#252936;
    color:white;
    font-size:20px;
    z-index:20;
}

.modal-title{
    text-align:center;
    font-size:23px;
    font-weight:1000;
    padding:5px 45px 18px;
}

.roulette{
    position:relative;
    height:160px;
    overflow:hidden;
    border-radius:20px;
    background:#080a0f;
    border:1px solid #343846;
}

.roulette:before{
    content:"";
    position:absolute;
    left:50%;
    top:0;
    bottom:0;
    width:3px;
    transform:translateX(-50%);
    z-index:10;
    background:white;
    box-shadow:
        0 0 15px white,
        0 0 35px #8b5cf6;
}

.roulette:after{
    content:"";
    position:absolute;
    inset:0;
    z-index:5;
    pointer-events:none;
    background:
        linear-gradient(
            90deg,
            #080a0f 0%,
            transparent 17%,
            transparent 83%,
            #080a0f 100%
        );
}

.track{
    display:flex;
    align-items:center;
    height:100%;
    gap:10px;
    will-change:transform;
}

.roll{
    width:115px;
    height:120px;
    flex:0 0 115px;
    border-radius:19px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:#171a23;
    border:1px solid #333846;
}

.roll-icon{
    font-size:45px;
}

.roll-name{
    margin-top:7px;
    font-size:10px;
    text-align:center;
    font-weight:900;
}

.roll-rarity{
    margin-top:3px;
    font-size:9px;
    font-weight:900;
}

.result{
    display:none;
    text-align:center;
    padding-top:22px;
}

.result.show{
    display:block;
}

.result-art{
    width:120px;
    height:120px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:30px;
    font-size:70px;
    background:
        radial-gradient(
            circle,
            #7138ee,
            #171321
        );
    box-shadow:
        0 0 30px #8b5cf6aa,
        0 0 80px #8b5cf633;
    animation:
        pop .8s
        cubic-bezier(.2,1.6,.3,1);
}

.result-name{
    font-size:24px;
    font-weight:1000;
    margin-top:13px;
}

.result-value{
    margin-top:7px;
    color:#aaa;
    font-weight:900;
}

.done{
    width:100%;
    border:0;
    padding:14px;
    margin-top:17px;
    border-radius:16px;
    background:#7437e8;
    color:white;
    font-weight:1000;
}

@keyframes pop{

    0%{
        transform:scale(.1) rotate(-20deg);
        opacity:0;
    }

    70%{
        transform:scale(1.12) rotate(4deg);
    }

    100%{
        transform:scale(1);
        opacity:1;
    }

}

/* COINS */

.coin{
    position:fixed;
    z-index:500;
    pointer-events:none;
    font-size:24px;
    animation:coin .9s ease forwards;
}

@keyframes coin{

    0%{
        opacity:1;
        transform:translate(0,0) scale(1);
    }

    100%{
        opacity:0;
        transform:
            translate(
                0,
                -260px
            )
            scale(.3);
    }

}

/* BOTTOM NAV */

nav{
    position:fixed;
    left:50%;
    bottom:10px;
    transform:translateX(-50%);
    width:min(
        calc(100% - 20px),
        680px
    );
    z-index:100;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:5px;
    padding:7px;
    border-radius:23px;
    background:rgba(17,19,27,.94);
    border:1px solid #303440;
    backdrop-filter:blur(20px);
    box-shadow:0 15px 50px #0009;
}

nav button{
    border:0;
    border-radius:17px;
    padding:9px 4px;
    background:transparent;
    color:#747b8a;
    font-size:10px;
    font-weight:900;
}

nav button.active{
    color:white;
    background:#7437e8;
}

.ico{
    display:block;
    font-size:20px;
    margin-bottom:3px;
}

.empty{
    text-align:center;
    padding:40px;
    color:#777e8d;
}

.toast{
    position:fixed;
    z-index:600;
    left:20px;
    right:20px;
    bottom:95px;
    padding:14px;
    border-radius:16px;
    text-align:center;
    background:#252936;
    border:1px solid #3b4050;
    display:none;
    font-weight:800;
}

@media(max-width:430px){

    .case-grid{
        grid-template-columns:1fr 1fr;
        gap:9px;
    }

    .case{
        min-height:260px;
        padding:10px;
    }

    .case-art{
        height:130px;
        font-size:60px;
    }

    .case-name{
        font-size:16px;
    }

    .roll{
        width:105px;
        flex-basis:105px;
    }

}

</style>

</head>


<body>

<div class="app">

<header>

    <div class="logo">
        NEXORA
    </div>

    <div class="balance">
        🪙
        <span id="coins">0</span>
    </div>

</header>


<!-- PROFILE -->

<section
    id="profile"
    class="page active">

    <div class="title">
        Профиль
    </div>

    <div class="card profile">

        <div
            class="avatar"
            id="avatar">

            N

        </div>

        <div
            class="name"
            id="name">

            Загрузка...

        </div>

        <div
            class="tgid"
            id="tgid">

            @username • ID: —

        </div>

        <div class="stats">

            <div class="stat">
                <b id="nftCount">0</b>
                <span>NFT</span>
            </div>

            <div class="stat">
                <b id="collection">0</b>
                <span>КОЛЛЕКЦИЯ</span>
            </div>

            <div class="stat">
                <b id="received">0</b>
                <span>ПОЛУЧЕНО</span>
            </div>

        </div>

    </div>

    <div class="card">

        <b>Добро пожаловать в NEXORA</b>

        <p class="subtitle">

            Открывай коллекции,
            собирай редкие NFT
            и развивай свой инвентарь.

        </p>

    </div>

</section>


<!-- CASES -->

<section
    id="cases"
    class="page">

    <div class="title">
        Кейсы
    </div>

    <div class="subtitle">

        10 коллекций • 60 уникальных NFT

    </div>

    <div
        id="caseGrid"
        class="case-grid">

    </div>

</section>


<!-- INVENTORY -->

<section
    id="inventory"
    class="page">

    <div class="title">
        Инвентарь
    </div>

    <div
        id="inventoryList">

    </div>

</section>


<!-- RATING -->

<section
    id="rating"
    class="page">

    <div class="title">
        Рейтинг
    </div>

    <div class="tabs">

        <button
            id="richTab"
            class="tab active"
            onclick="showRating('rich')">

            💰 Богатые

        </button>

        <button
            id="expTab"
            class="tab"
            onclick="showRating('exp')">

            💎 NFT

        </button>

    </div>

    <div
        class="card"
        id="ratingList">

    </div>

</section>

</div>


<!-- BOTTOM -->

<nav>

    <button
        class="active"
        onclick="go('profile',this)">

        <span class="ico">👤</span>
        Профиль

    </button>

    <button
        onclick="go('cases',this)">

        <span class="ico">📦</span>
        Кейсы

    </button>

    <button
        onclick="go('inventory',this)">

        <span class="ico">🎒</span>
        Инвентарь

    </button>

    <button
        onclick="go('rating',this)">

        <span class="ico">🏆</span>
        Рейтинг

    </button>

</nav>


<!-- CASE MODAL -->

<div
    id="modal"
    class="modal">

    <div class="modal-box">

        <button
            class="close"
            onclick="closeModal()">

            ×

        </button>

        <div
            id="modalTitle"
            class="modal-title">

            Открытие

        </div>

        <div class="roulette">

            <div
                id="track"
                class="track">

            </div>

        </div>

        <div
            id="result"
            class="result">

            <div
                id="resultArt"
                class="result-art">

            </div>

            <div
                id="resultName"
                class="result-name">

            </div>

            <div
                id="resultRarity"
                class="nft-rarity">

            </div>

            <div
                id="resultValue"
                class="result-value">

            </div>

            <button
                class="done"
                onclick="closeModal()">

                ЗАБРАТЬ NFT

            </button>

        </div>

    </div>

</div>


<div
    id="toast"
    class="toast">

</div>


<script>

const tg =
    window.Telegram.WebApp;

tg.ready();
tg.expand();

const initData =
    tg.initData;

let user = null;
let cases = [];
let rankings = null;
let rolling = false;


/* API */

async function api(
    url,
    options={}
){

    options.headers = {

        "Content-Type":
            "application/json",

        "X-Telegram-Init-Data":
            initData,

        ...(options.headers || {})

    };

    const response =
        await fetch(
            url,
            options
        );

    const data =
        await response.json();

    if(!response.ok){

        throw new Error(
            data.error ||
            "Ошибка сервера"
        );

    }

    return data;

}


/* NAV */

function go(
    id,
    button
){

    document
        .querySelectorAll(".page")
        .forEach(
            x =>
                x.classList.remove(
                    "active"
                )
        );

    document
        .getElementById(id)
        .classList.add(
            "active"
        );

    document
        .querySelectorAll("nav button")
        .forEach(
            x =>
                x.classList.remove(
                    "active"
                )
        );

    button.classList.add("active");

    if(id === "rating"){
        loadRating();
    }

}


/* TOAST */

function toast(
    text
){

    const el =
        document.getElementById(
            "toast"
        );

    el.textContent =
        text;

    el.style.display =
        "block";

    setTimeout(
        ()=>{
            el.style.display =
                "none";
        },
        2200
    );

}


/* LOAD */

async function load(){

    try{

        user =
            await api(
                "/api/me",
                {
                    method:"POST"
                }
            );

        cases =
            await api(
                "/api/cases"
            );

        render();

    }
    catch(e){

        toast(e.message);

    }

}


/* RENDER */

function render(){

    document.getElementById(
        "coins"
    ).textContent =
        user.coins;

    document.getElementById(
        "name"
    ).textContent =
        user.first_name ||
        "Player";

    document.getElementById(
        "avatar"
    ).textContent =
        (
            user.first_name ||
            "N"
        ).charAt(0).toUpperCase();

    document.getElementById(
        "tgid"
    ).textContent =
        (
            user.username
            ? "@"+user.username
            : "@username"
        )
        +
        " • ID: "
        +
        user.id;

    document.getElementById(
        "nftCount"
    ).textContent =
        user.nfts.length;

    const collection =
        user.nfts.reduce(
            (sum,nft)=>
                sum+nft.value,
            0
        );

    document.getElementById(
        "collection"
    ).textContent =
        collection;

    document.getElementById(
        "received"
    ).textContent =
        user.total_received_value;

    renderCases();
    renderInventory();

}


/* CASES */

function renderCases(){

    const grid =
        document.getElementById(
            "caseGrid"
        );

    grid.innerHTML = "";

    cases.forEach(
        c=>{

            grid.innerHTML += `

                <div class="case">

                    <div class="case-art">
                        ${c.icon}
                    </div>

                    <div class="case-name">
                        ${esc(c.name)}
                    </div>

                    <div class="case-sub">
                        ${esc(c.subtitle)}
                    </div>

                    <div class="case-count">
                        💎 ${c.count} NFT
                    </div>

                    <button
                        class="open-btn"
                        onclick="openCase(${c.id})">

                        ОТКРЫТЬ

                    </button>

                </div>

            `;

        }
    );

}


/* OPEN */

async function openCase(
    id
){

    if(rolling){
        return;
    }

    const selected =
        cases.find(
            x=>x.id===id
        );

    if(!selected){
        return;
    }

    try{

        rolling = true;

        const before =
            await api(
                "/api/cases/open",
                {
                    method:"POST",
                    body:JSON.stringify({
                        case_id:id
                    })
                }
            );

        user = before;

        const newest =
            user.nfts[0];

        showRoll(
            selected,
            newest
        );

    }
    catch(e){

        rolling=false;

        toast(
            e.message
        );

    }

}


/* ROLL */

function showRoll(
    selected,
    reward
){

    const modal =
        document.getElementById(
            "modal"
        );

    const track =
        document.getElementById(
            "track"
        );

    const result =
        document.getElementById(
            "result"
        );

    result.classList.remove(
        "show"
    );

    document.getElementById(
        "modalTitle"
    ).textContent =
        selected.name;

    track.innerHTML = "";

    /*
      Много визуальных карточек
      + в конце настоящий NFT.
    */

    const visualPool =
        selected.pool;

    for(
        let i=0;
        i<38;
        i++
    ){

        const nft =
            visualPool[
                Math.floor(
                    Math.random() *
                    visualPool.length
                )
            ];

        addRollCard(
            track,
            nft
        );

    }

    /*
      Реальный результат
      всегда последним.
    */

    addRollCard(
        track,
        reward
    );

    modal.classList.add(
        "show"
    );

    track.style.transition =
        "none";

    track.style.transform =
        "translateX(0)";

    requestAnimationFrame(
        ()=>{

            const cards =
                track.querySelectorAll(
                    ".roll"
                );

            const last =
                cards[cards.length-1];

            const viewport =
                document.querySelector(
                    ".roulette"
                );

            const target =
                last.offsetLeft
                -
                (
                    viewport.clientWidth/2
                    -
                    last.offsetWidth/2
                );

            setTimeout(
                ()=>{

                    track.style.transition =
                        "transform 6s cubic-bezier(.06,.72,.12,1)";

                    track.style.transform =
                        `translateX(-${target}px)`;

                },
                100
            );

            setTimeout(
                ()=>{

                    document.getElementById(
                        "resultArt"
                    ).textContent =
                        reward.icon;

                    document.getElementById(
                        "resultName"
                    ).textContent =
                        reward.name;

                    const rarity =
                        document.getElementById(
                            "resultRarity"
                        );

                    rarity.textContent =
                        reward.rarity;

                    rarity.className =
                        "nft-rarity " +
                        reward.rarity;

                    document.getElementById(
                        "resultValue"
                    ).textContent =
                        "💎 " +
                        reward.value;

                    result.classList.add(
                        "show"
                    );

                    tg.HapticFeedback
                      ?.notificationOccurred(
                          "success"
                      );

                    rolling=false;

                },
                6250
            );

        }
    );

}


/* ROLL CARD */

function addRollCard(
    track,
    nft
){

    track.innerHTML += `

        <div class="roll">

            <div class="roll-icon">
                ${nft.icon}
            </div>

            <div class="roll-name">
                ${esc(nft.name)}
            </div>

            <div
                class="roll-rarity ${nft.rarity}">

                ${nft.rarity}

            </div>

        </div>

    `;

}


/* CLOSE */

function closeModal(){

    if(rolling){
        return;
    }

    document
        .getElementById("modal")
        .classList.remove(
            "show"
        );

    render();

}


/*
  Закрытие по нажатию
  вне самого окна.
*/

document
    .getElementById("modal")
    .addEventListener(
        "click",
        function(e){

            if(
                e.target === this &&
                !rolling
            ){

                closeModal();

            }

        }
    );


/* INVENTORY */

function renderInventory(){

    const box =
        document.getElementById(
            "inventoryList"
        );

    box.innerHTML = "";

    if(!user.nfts.length){

        box.innerHTML = `
            <div class="empty">
                Инвентарь пуст
            </div>
        `;

        return;

    }

    user.nfts.forEach(
        nft=>{

            box.innerHTML += `

                <div
                    class="card sell-card"
                    id="nft-${nft.id}">

                    <div class="nft">

                        <div class="nft-art">
                            ${nft.icon}
                        </div>

                        <div class="nft-info">

                            <div class="nft-name">
                                ${esc(nft.name)}
                            </div>

                            <div
                                class="nft-rarity ${nft.rarity}">

                                ${nft.rarity}

                            </div>

                            <div class="nft-value">

                                💎 ${nft.value}

                            </div>

                        </div>

                        <button
                            class="sell"
                            onclick="
                                sellNFT(
                                    ${nft.id},
                                    ${nft.value}
                                )
                            ">

                            ПРОДАТЬ

                        </button>

                    </div>

                </div>

            `;

        }
    );

}


/* SELL */

async function sellNFT(
    id,
    value
){

    const card =
        document.getElementById(
            "nft-"+id
        );

    if(!card){
        return;
    }

    try{

        user =
            await api(
                "/api/sell",
                {
                    method:"POST",
                    body:JSON.stringify({
                        nft_id:id
                    })
                }
            );

        card.classList.add(
            "selling"
        );

        coinsEffect();

        tg.HapticFeedback
          ?.impactOccurred(
              "medium"
          );

        setTimeout(
            ()=>{
                render();
                toast(
                    "+" +
                    value +
                    " 🪙"
                );
            },
            500
        );

    }
    catch(e){

        toast(
            e.message
        );

    }

}


/* COIN EFFECT */

function coinsEffect(){

    for(
        let i=0;
        i<8;
        i++
    ){

        const coin =
            document.createElement(
                "div"
            );

        coin.className =
            "coin";

        coin.textContent =
            "🪙";

        coin.style.left =
            (
                30 +
                Math.random()*40
            ) +
            "%";

        coin.style.top =
            (
                45 +
                Math.random()*20
            ) +
            "%";

        coin.style.animationDelay =
            (
                Math.random()*.2
            ) +
            "s";

        document.body.appendChild(
            coin
        );

        setTimeout(
            ()=>{
                coin.remove();
            },
            1100
        );

    }

}


/* RATING */

async function loadRating(){

    try{

        rankings =
            await api(
                "/api/leaderboard"
            );

        showRating(
            "rich"
        );

    }
    catch(e){

        toast(
            e.message
        );

    }

}


function showRating(
    type
){

    if(!rankings){
        return;
    }

    document
        .getElementById("richTab")
        .classList.toggle(
            "active",
            type==="rich"
        );

    document
        .getElementById("expTab")
        .classList.toggle(
            "active",
            type==="exp"
        );

    const list =
        type==="rich"
        ? rankings.richest
        : rankings.expensive;

    const box =
        document.getElementById(
            "ratingList"
        );

    box.innerHTML = "";

    if(!list.length){

        box.innerHTML =
            `<div class="empty">
                Пока пусто
            </div>`;

        return;

    }

    list.forEach(
        (p,index)=>{

            const name =
                p.username
                ? "@"+p.username
                : (
                    p.first_name ||
                    "Player"
                );

            let value;
            let sub;

            if(
                type==="rich"
            ){

                value =
                    "🪙 " +
                    (
                        p.coins +
                        p.collection_value
                    );

                sub =
                    "Баланс + коллекция";

            }
            else{

                value =
                    "💎 " +
                    p.value;

                sub =
                    p.name +
                    " • " +
                    p.rarity;

            }

            box.innerHTML += `

                <div class="leader">

                    <div class="place">
                        #${index+1}
                    </div>

                    <div class="lname">

                        ${esc(name)}

                        <br>

                        <span class="subtitle">
                            ${esc(sub)}
                        </span>

                    </div>

                    <div class="lvalue">
                        ${value}
                    </div>

                </div>

            `;

        }
    );

}


/* ESCAPE */

function esc(
text
){

    const d =
        document.createElement(
            "div"
        );

    d.textContent =
        text ?? "";

    return d.innerHTML;

}


/* START */

load();

</script>
