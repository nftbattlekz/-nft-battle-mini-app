<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>NEXORA</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:#07080c;
    color:#fff;
    font-family:Arial,sans-serif;
}

button{
    font-family:inherit;
}

.app{
    max-width:620px;
    margin:auto;
    padding-bottom:95px;
}

header{
    padding:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(7,8,12,.94);
    backdrop-filter:blur(15px);
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:3px;
}

.balance{
    background:#171a22;
    border:1px solid #292e3b;
    border-radius:14px;
    padding:9px 12px;
    font-weight:900;
}

.page{
    display:none;
    padding:8px 16px;
}

.page.active{
    display:block;
}

.title{
    font-size:28px;
    font-weight:900;
    margin:15px 0;
}

.card{
    background:#11141b;
    border:1px solid #272c37;
    border-radius:22px;
    padding:17px;
    margin-bottom:12px;
}

.profile{
    background:
    radial-gradient(circle at 90% 10%,#5223a755,transparent 35%),
    linear-gradient(145deg,#171421,#0d0f15);
}

.avatar{
    width:68px;
    height:68px;
    border-radius:21px;
    background:linear-gradient(135deg,#7c3aed,#db2777);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:29px;
    font-weight:900;
}

.name{
    font-size:22px;
    font-weight:900;
    margin-top:12px;
}

.tgid{
    color:#858c99;
    margin-top:4px;
    word-break:break-all;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:18px;
}

.stat{
    background:#090b10;
    border-radius:15px;
    padding:13px 4px;
    text-align:center;
}

.stat b{
    display:block;
    font-size:18px;
}

.stat span{
    color:#777e8d;
    font-size:10px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:11px;
}

.case{
    background:#12151d;
    border:1px solid #292e39;
    border-radius:20px;
    padding:14px;
    overflow:hidden;
}

.case-art{
    height:130px;
    border-radius:16px;
    background:
    radial-gradient(circle,#6336bc,#17121f 68%);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:65px;
    box-shadow:inset 0 0 35px #0005;
}

.case h3{
    margin:12px 0 5px;
    font-size:17px;
}

.muted{
    color:#858c99;
    font-size:12px;
}

.value{
    font-weight:900;
    margin-top:7px;
}

.btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:15px;
    background:#7437e8;
    color:#fff;
    font-weight:900;
    font-size:14px;
    margin-top:10px;
}

.btn:active{
    transform:scale(.97);
}

.btn.dark{
    background:#20242e;
}

/* CASE OPENING */

.case-modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.82);
    backdrop-filter:blur(12px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:18px;
}

.case-modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:580px;
    background:#10131a;
    border:1px solid #303541;
    border-radius:25px;
    padding:20px;
    overflow:hidden;
    box-shadow:0 0 70px #000;
}

.modal-title{
    text-align:center;
    font-size:22px;
    font-weight:900;
    margin-bottom:18px;
}

.roulette{
    position:relative;
    height:145px;
    overflow:hidden;
    border-radius:18px;
    background:#080a0f;
    border:1px solid #292e38;
}

.roulette::before{
    content:"";
    position:absolute;
    top:0;
    bottom:0;
    left:50%;
    width:3px;
    transform:translateX(-50%);
    background:#fff;
    box-shadow:
    0 0 12px #fff,
    0 0 30px #8b5cf6;
    z-index:10;
}

.roulette::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
    linear-gradient(
        90deg,
        #080a0f 0%,
        transparent 15%,
        transparent 85%,
        #080a0f 100%
    );
    z-index:5;
}

.roulette-track{
    height:100%;
    display:flex;
    align-items:center;
    gap:10px;
    transform:translateX(0);
    will-change:transform;
}

.roll-card{
    flex:0 0 110px;
    height:112px;
    border-radius:17px;
    background:
    linear-gradient(145deg,#202532,#10131a);
    border:1px solid #343a49;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.roll-icon{
    font-size:43px;
    margin-bottom:6px;
}

.roll-name{
    font-size:10px;
    text-align:center;
    padding:0 4px;
    font-weight:800;
}

.roll-rarity{
    font-size:9px;
    color:#a98cff;
    margin-top:3px;
}

.open-result{
    display:none;
    text-align:center;
    margin-top:20px;
    animation:resultIn .55s ease;
}

.open-result.show{
    display:block;
}

.result-icon{
    width:100px;
    height:100px;
    margin:auto;
    border-radius:25px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:60px;
    background:radial-gradient(circle,#6336bc,#17121f);
    box-shadow:
    0 0 25px #8b5cf688,
    0 0 70px #8b5cf633;
    animation:winPop .8s cubic-bezier(.2,1.6,.4,1);
}

.result-name{
    font-size:22px;
    font-weight:900;
    margin-top:12px;
}

.result-rarity{
    color:#a98cff;
    margin-top:5px;
    font-weight:800;
}

@keyframes winPop{
    0%{
        transform:scale(.2) rotate(-15deg);
        opacity:0;
    }
    70%{
        transform:scale(1.12) rotate(3deg);
    }
    100%{
        transform:scale(1);
        opacity:1;
    }
}

@keyframes resultIn{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* INVENTORY */

.nft{
    display:flex;
    align-items:center;
    gap:13px;
}

.nftart{
    width:70px;
    height:70px;
    flex:none;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:36px;
    background:
    radial-gradient(circle,#3d2c67,#12151c);
    transition:.35s;
}

.nftinfo{
    flex:1;
}

.nftname{
    font-weight:900;
    font-size:16px;
}

.rarity{
    color:#a98cff;
    font-size:12px;
    margin-top:4px;
}

.nftvalue{
    font-weight:900;
    margin-top:5px;
}

.sell-card{
    transition:
    opacity .45s,
    transform .45s,
    max-height .45s,
    margin .45s,
    padding .45s;
    max-height:220px;
    overflow:hidden;
}

.sell-card.selling{
    opacity:0;
    transform:
    translateX(120px)
    scale(.7)
    rotate(7deg);
    max-height:0;
    margin:0;
    padding-top:0;
    padding-bottom:0;
}

.coin-fly{
    position:fixed;
    z-index:200;
    font-size:25px;
    pointer-events:none;
    animation:coinFly .8s ease forwards;
}

@keyframes coinFly{
    0%{
        opacity:1;
        transform:translate(0,0) scale(1);
    }
    100%{
        opacity:0;
        transform:translate(
            calc(50vw - 30px),
            calc(-50vh + 40px)
        ) scale(.4);
    }
}

/* RATING */

.tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:12px;
}

.tab{
    border:0;
    border-radius:14px;
    padding:12px;
    background:#171a22;
    color:#858c99;
    font-weight:900;
}

.tab.active{
    background:#7437e8;
    color:#fff;
}

.leader{
    display:flex;
    align-items:center;
    gap:10px;
    padding:13px 0;
    border-bottom:1px solid #252a34;
}

.place{
    width:35px;
    color:#777;
    font-weight:900;
}

.lname{
    flex:1;
    font-weight:800;
}

.lvalue{
    color:#a98cff;
    font-weight:900;
}

.empty{
    text-align:center;
    color:#777;
    padding:25px;
}

.toast{
    position:fixed;
    left:20px;
    right:20px;
    bottom:90px;
    z-index:300;
    background:#252934;
    border:1px solid #383e4b;
    border-radius:15px;
    padding:14px;
    text-align:center;
    display:none;
    box-shadow:0 10px 40px #0008;
}

@media(max-width:390px){

    .grid{
        grid-template-columns:1fr;
    }

    .roll-card{
        flex-basis:105px;
    }

}

</style>
</head>


<body>

<div class="app">

<header>

    <div class="logo">
        NEXORA
    </div>

    <div class="balance">
        🪙 <span id="coins">0</span>
    </div>

</header>


<!-- PROFILE -->

<section
    id="profile"
    class="page active">

    <div class="title">
        Профиль
    </div>

    <div class="card profile">

        <div
            class="avatar"
            id="avatar">

            N

        </div>

        <div
            class="name"
            id="name">

            Загрузка...

        </div>

        <div
            class="tgid"
            id="tgid">

            @username • ID: —

        </div>

        <div class="stats">

            <div class="stat">

                <b id="nftCount">
                    0
                </b>

                <span>
                    NFT
                </span>

            </div>

            <div class="stat">

                <b id="collection">
                    0
                </b>

                <span>
                    КОЛЛЕКЦИЯ
                </span>

            </div>

            <div class="stat">

                <b id="received">
                    0
                </b>

                <span>
                    ПОЛУЧЕНО
                </span>

            </div>

        </div>

    </div>

    <div class="card">

        <b>
            Добро пожаловать в NEXORA
        </b>

        <p class="muted">

            Собирай NFT, открывай кейсы,
            продавай предметы и поднимайся
            в рейтинге.

        </p>

    </div>

</section>


<!-- CASES -->

<section
    id="cases"
    class="page">

    <div class="title">
        Кейсы
    </div>

    <div class="card">

        <span class="muted">

            Выбирай кейс и запускай
            красивую анимацию открытия.

        </span>

    </div>

    <div
        id="caseGrid"
        class="grid">

    </div>

</section>


<!-- INVENTORY -->

<section
    id="inventory"
    class="page">

    <div class="title">
        Инвентарь
    </div>

    <div
        id="inventoryList">

    </div>

</section>


<!-- RATING -->

<section
    id="rating"
    class="page">

    <div class="title">
        Рейтинг
    </div>

    <div class="tabs">

        <button
            class="tab active"
            id="richTab"
            onclick="showRating('rich')">

            💰 Богатые

        </button>

        <button
            class="tab"
            id="expTab"
            onclick="showRating('exp')">

            💎 NFT

        </button>

    </div>

    <div
        class="card"
        id="ratingList">

    </div>

</section>

</div>


<!-- NAV -->

<nav>

    <button
        class="active"
        onclick="page('profile',this)">

        <span class="ico">
            👤
        </span>

        Профиль

    </button>

    <button
        onclick="page('cases',this)">

        <span class="ico">
            📦
        </span>

        Кейсы

    </button>

    <button
        onclick="page('inventory',this)">

        <span class="ico">
            🎒
        </span>

        Инвентарь

    </button>

    <button
        onclick="page('rating',this)">

        <span class="ico">
            🏆
        </span>

        Рейтинг

    </button>

</nav>


<!-- CASE MODAL -->

<div
    id="caseModal"
    class="case-modal">

    <div class="modal-box">

        <div
            class="modal-title"
            id="modalTitle">

            Открытие кейса

        </div>

        <div
            class="roulette">

            <div
                id="rouletteTrack"
                class="roulette-track">

            </div>

        </div>

        <div
            id="openResult"
            class="open-result">

            <div
                id="resultIcon"
                class="result-icon">

            </div>

            <div
                id="resultName"
                class="result-name">

            </div>

            <div
                id="resultRarity"
                class="result-rarity">

            </div>

            <div
                id="resultValue"
                class="value">

            </div>

            <button
                class="btn"
                onclick="closeCase()">

                ЗАБРАТЬ NFT

            </button>

        </div>

    </div>

</div>


<div
    id="toast"
    class="toast">

</div>


<script>

const tg =
    window.Telegram.WebApp;

tg.ready();
tg.expand();

const initData =
    tg.initData;

let user = null;
let cases = [];
let rankings = null;


/* API */

async function api(
    url,
    options = {}
){

    options.headers = {

        "Content-Type":
            "application/json",

        "X-Telegram-Init-Data":
            initData,

        ...(options.headers || {})

    };

    const response =
        await fetch(
            url,
            options
        );

    const data =
        await response.json();

    if(!response.ok){

        throw new Error(
            data.error ||
            "Ошибка сервера"
        );

    }

    return data;

}


/* TOAST */

function toast(message){

    const el =
        document.getElementById(
            "toast"
        );

    el.textContent =
        message;

    el.style.display =
        "block";

    setTimeout(
        ()=>{
            el.style.display =
                "none";
        },
        2200
    );

}


/* NAVIGATION */

function page(
    id,
    button
){

    document
        .querySelectorAll(
            ".page"
        )
        .forEach(
            x =>
                x.classList
                 .remove("active")
        );

    document
        .getElementById(id)
        .classList
        .add("active");

    document
        .querySelectorAll(
            "nav button"
        )
        .forEach(
            x =>
                x.classList
                 .remove("active")
        );

    button.classList.add(
        "active"
    );

    if(id === "rating"){

        loadRating();

    }

}


/* LOAD */

async function load(){

    try{

        user =
            await api(
                "/api/me",
                {
                    method:"POST"
                }
            );

        cases =
            await api(
                "/api/cases"
            );

        renderAll();

    }
    catch(error){

        console.error(error);

        toast(
            error.message
        );

    }

}


/* RENDER */

function renderAll(){

    document.getElementById(
        "coins"
    ).textContent =
        user.coins;

    document.getElementById(
        "name"
    ).textContent =
        user.first_name ||
        "Игрок";

    document.getElementById(
        "avatar"
    ).textContent =
        (
            user.first_name ||
            "N"
        )
        .charAt(0)
        .toUpperCase();

    document.getElementById(
        "tgid"
    ).textContent =

        (
            user.username
            ? "@"+user.username
            : "@username"
        )

        +
        " • ID: " +
        user.id;

    document.getElementById(
        "nftCount"
    ).textContent =
        user.nfts.length;

    const total =
        user.nfts.reduce(
            (sum,nft)=>
                sum + nft.value,
            0
        );

    document.getElementById(
        "collection"
    ).textContent =
        total;

    document.getElementById(
        "received"
    ).textContent =
        user.total_received_value;

    renderCases();
    renderInventory();

}


/* CASE CARDS */

function renderCases(){

    const container =
        document.getElementById(
            "caseGrid"
        );

    container.innerHTML = "";

    cases.forEach(
        c => {

            container.innerHTML += `

            <div class="case">

                <div class="case-art">

                    ${c.reward.icon}

                </div>

                <h3>

                    ${escapeHTML(
                        c.name
                    )}

                </h3>

                <div class="muted">

                    Награда:
                    ${escapeHTML(
                        c.reward.name
                    )}

                </div>

                <div class="rarity">

                    ${escapeHTML(
                        c.reward.rarity
                    )}

                </div>

                <div class="value">

                    🪙 ${c.price}

                </div>

                <button
                    class="btn"
                    onclick="openCase(${c.id})">

                    ОТКРЫТЬ

                </button>

            </div>

            `;

        }
    );

}


/* OPEN CASE */

async function openCase(id){

    const selected =
        cases.find(
            x => x.id === id
        );

    if(!selected){

        return;

    }

    if(
        !confirm(
            "Открыть " +
            selected.name +
            " за " +
            selected.price +
            " 🪙?"
        )
    ){

        return;

    }

    try{

        /*
         Получаем результат
         от сервера ДО запуска
         анимации.
        */

        const newUser =
            await api(
                "/api/cases/open",
                {
                    method:"POST",

                    body:
                        JSON.stringify({
                            case_id:id
                        })
                }
            );

        user =
            newUser;

        showCaseAnimation(
            selected
        );

    }
    catch(error){

        toast(
            error.message
        );

    }

}


/* CASE ANIMATION */

function showCaseAnimation(
    selected
){

    const modal =
        document.getElementById(
            "caseModal"
        );

    const track =
        document.getElementById(
            "rouletteTrack"
        );

    const result =
        document.getElementById(
            "openResult"
        );

    const resultIcon =
        document.getElementById(
            "resultIcon"
        );

    const resultName =
        document.getElementById(
            "resultName"
        );

    const resultRarity =
        document.getElementById(
            "resultRarity"
        );

    const resultValue =
        document.getElementById(
            "resultValue"
        );

    document.getElementById(
        "modalTitle"
    ).textContent =
        selected.name;

    result.classList.remove(
        "show"
    );

    track.style.transition =
        "none";

    track.style.transform =
        "translateX(0)";

    track.innerHTML = "";

    /*
       Создаём длинную ленту.
       Последняя карточка —
       фактическая награда.
    */

    const items = [];

    for(
        let i=0;
        i<30;
        i++
    ){

        items.push(
            randomVisualNFT()
        );

    }

    items.push(
        selected.reward
    );

    items.forEach(
        item => {

            track.innerHTML += `

            <div class="roll-card">

                <div class="roll-icon">

                    ${item.icon}

                </div>

                <div class="roll-name">

                    ${escapeHTML(
                        item.name
                    )}

                </div>

                <div class="roll-rarity">

                    ${escapeHTML(
                        item.rarity
                    )}

                </div>

            </div>

            `;

        }
    );

    modal.classList.add(
        "show"
    );

    /*
       Ждём рендер,
       затем запускаем прокрутку.
    */

    requestAnimationFrame(
        ()=>{

            const cards =
                track.querySelectorAll(
                    ".roll-card"
                );

            const last =
                cards[cards.length-1];

            const viewport =
                track.parentElement;

            const target =
                last.offsetLeft
                -
                (
                    viewport.clientWidth / 2
                    -
                    last.offsetWidth / 2
                );

            /*
               Быстрый старт →
               замедление →
               остановка.
            */

            setTimeout(
                ()=>{

                    track.style.transition =
                        "transform 5.8s cubic-bezier(.08,.72,.12,1)";

                    track.style.transform =
                        `translateX(-${target}px)`;

                },
                100
            );

            setTimeout(
                ()=>{

                    resultIcon.textContent =
                        selected.reward.icon;

                    resultName.textContent =
                        selected.reward.name;

                    resultRarity.textContent =
                        selected.reward.rarity;

                    resultValue.textContent =
                        "💎 " +
                        selected.reward.value;

                    result.classList.add(
                        "show"
                    );

                    tg.HapticFeedback
                      ?.notificationOccurred(
                          "success"
                      );

                },
                6200
            );

        }
    );

}


/* RANDOM VISUAL CARD */

function randomVisualNFT(){

    const list = [

        {
            name:"Cyber Cat",
            rarity:"Common",
            icon:"🐱"
        },

        {
            name:"Neon Samurai",
            rarity:"Common",
            icon:"⚔️"
        },

        {
            name:"Shadow Wolf",
            rarity:"Rare",
            icon:"🐺"
        },

        {
            name:"Chrome Rider",
            rarity:"Rare",
            icon:"🏍️"
        },

        {
            name:"Cyber Knight",
            rarity:"Epic",
            icon:"🛡️"
        },

        {
            name:"Void Guardian",
            rarity:"Epic",
            icon:"👾"
        },

        {
            name:"Galaxy Dragon",
            rarity:"Legendary",
            icon:"🐉"
        },

        {
            name:"Quantum Ghost",
            rarity:"Legendary",
            icon:"👻"
        }

    ];

    return list[
        Math.floor(
            Math.random() *
            list.length
        )
    ];

}


/* CLOSE CASE */

function closeCase(){

    document
        .getElementById(
            "caseModal"
        )
        .classList
        .remove("show");

    renderAll();

    toast(
        "NFT добавлен в инвентарь"
    );

}


/* INVENTORY */

function renderInventory(){

    const container =
        document.getElementById(
            "inventoryList"
        );

    container.innerHTML = "";

    if(
        !user.nfts ||
        user.nfts.length === 0
    ){

        container.innerHTML = `

            <div class="empty">

                Инвентарь пуст

            </div>

        `;

        return;

    }

    user.nfts.forEach(
        nft => {

            container.innerHTML += `

            <div
                class="card sell-card"
                id="nft-${nft.id}">

                <div class="nft">

                    <div class="nftart">

                        ${nft.icon}

                    </div>

                    <div class="nftinfo">

                        <div class="nftname">

                            ${escapeHTML(
                                nft.name
                            )}

                        </div>

                        <div class="rarity">

                            ${escapeHTML(
                                nft.rarity
                            )}

                        </div>

                        <div class="nftvalue">

                            💎 ${nft.value}

                        </div>

                    </div>

                </div>

                <button
                    class="btn dark"
                    onclick="sellNFT(${nft.id},${nft.value})">

                    ПРОДАТЬ
                    ЗА
                    ${nft.value}
                    🪙

                </button>

            </div>

            `;

        }
    );

}


/* SELL ANIMATION */

async function sellNFT(
    id,
    value
){

    const card =
        document.getElementById(
            "nft-"+id
        );

    if(!card){

        return;

    }

    if(
        !confirm(
            "Продать NFT за " +
            value +
            " 🪙?"
        )
    ){

        return;

    }

    try{

        /*
           Сначала меняем сервер.
        */

        user =
            await api(
                "/api/sell",
                {
                    method:"POST",

                    body:
                        JSON.stringify({
                            nft_id:id
                        })
                }
            );

        /*
           Запускаем визуальное
           исчезновение карточки.
        */

        card.classList.add(
            "selling"
        );

        createCoins();

        tg.HapticFeedback
          ?.impactOccurred(
              "medium"
          );

        setTimeout(
            ()=>{

                renderAll();

                toast(
                    "+" +
                    value +
                    " 🪙"
                );

            },
            500
        );

    }
    catch(error){

        toast(
            error.message
        );

    }

}


/* COIN EFFECT */

function createCoins(){

    for(
        let i=0;
        i<7;
        i++
    ){

        const coin =
            document.createElement(
                "div"
            );

        coin.className =
            "coin-fly";

        coin.textContent =
            "🪙";

        coin.style.left =
            (
                30 +
                Math.random()*40
            ) +
            "%";

        coin.style.top =
            (
                45 +
                Math.random()*20
            ) +
            "%";

        coin.style.animationDelay =
            (
                Math.random()*.15
            ) +
            "s";

        document.body.appendChild(
            coin
        );

        setTimeout(
            ()=>{
                coin.remove();
            },
            1000
        );

    }

}


/* RATING */

async function loadRating(){

    try{

        rankings =
            await api(
                "/api/leaderboard"
            );

        showRating(
            "rich"
        );

    }
    catch(error){

        toast(
            error.message
        );

    }

}


function showRating(type){

    if(!rankings){

        return;

    }

    document
        .getElementById(
            "richTab"
        )
        .classList
        .toggle(
            "active",
            type === "rich"
        );

    document
        .getElementById(
            "expTab"
        )
        .classList
        .toggle(
            "active",
            type === "exp"
        );

    const list =
        type === "rich"
        ? rankings.richest
        : rankings.expensive;

    const container =
        document.getElementById(
            "ratingList"
        );

    container.innerHTML = "";

    list.forEach(
        (player,index)=>{

            const username =
                player.username
                ? "@"+player.username
                : (
                    player.first_name ||
                    "Игрок"
                );

            let value;
            let subtitle;

            if(
                type === "rich"
            ){

                value =
                    "🪙 " +
                    (
                        player.coins +
                        player.collection_value
                    );

                subtitle =
                    "Баланс + коллекция";

            }
            else{

                value =
                    "💎 " +
                    player.value;

                subtitle =
                    escapeHTML(
                        player.name
                    )
                    +
                    " • "
                    +
                    escapeHTML(
                        player.rarity
                    );

            }

            container.innerHTML += `

            <div class="leader">

                <div class="place">

                    #${index+1}

                </div>

                <div class="lname">

                    ${escapeHTML(
                        username
                    )}

                    <br>

                    <span class="muted">

                        ${subtitle}

                    </span>

                </div>

                <div class="lvalue">

                    ${value}

                </div>

            </div>

            `;

        }
    );

}


/* ESCAPE */

function escapeHTML(
    text
){

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text ?? "";

    return div.innerHTML;

}


/* START */

load();

</script>

</html>
